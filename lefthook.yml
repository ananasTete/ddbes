pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
